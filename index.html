<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garland Catalog</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

   <div class="brand">

    <img src="images/logo.jgp" alt="Garland Logo">

    <h1>GARLAND</h1>

    <p>Premium Collection Catalog</p>

   </div>

</header>


<section class="intro">

    <h2>Welcome to Garland</h2>

    <p>
        Discover our premium products collection.
        Quality, elegance and modern design.
    </p>

</section>


<section class="catalog">


    <div class="card">
        <img src="images/product1.jpg" alt="Product One">

        <h2>Product One</h2>

        <p>
            Premium quality product.
        </p>

    </div>


    <div class="card">
        <img src="images/product1.jpg" alt="Product Two">

        <h2>Product Two</h2>

        <p>
            Elegant design and high quality.
        </p>

    </div>


    <div class="card">
        <img src="images/product1.jpg" alt="Product Three">

        <h2>Product Three</h2>

        <p>
            Modern collection item.
        </p>

    </div>


</section>


<footer>
    <p>© 2026 Garland Catalog</p>
</footer>


</body>

</html>
