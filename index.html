<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Garland</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<header>

    <div class="brand">

        <img src="images/logo.jpg" alt="Garland Logo">

        <h1>GARLAND</h1>

        <p>Premium Makeup Collection</p>

    </div>

</header>



<section class="intro">

    <h2>Welcome to Garland</h2>

    <p>
        Discover our premium makeup collection.
        Quality, elegance and modern beauty design.
    </p>

</section>




<section class="categories">


    <h2>Makeup Categories</h2>


    <div class="category-list">



        <div class="category">

            <img src="images/face-icon.png" alt="Face">

            <h3>FACE</h3>

        </div>



        <div class="category">

            <img src="images/lips-icon.png" alt="Lips">

            <h3>LIPS</h3>

        </div>



        <div class="category">

            <img src="images/eyes-icon.png" alt="Eyes">

            <h3>EYES</h3>

        </div>



        <div class="category">

            <img src="images/tools-icon.png" alt="Tools">

            <h3>TOOLS</h3>

        </div>



    </div>


</section>




<footer>

    © Garland Premium Makeup

</footer>



</body>

</html>
